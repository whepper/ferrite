name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: rust

jobs:
  build-and-test:
    name: Build and self-contained tests (Rust 1.99.1)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1

      - name: Build default configuration
        run: cargo build --locked

      - name: Build no-default-features configuration
        run: cargo build --locked --no-default-features

      # These 15 tests require external C artifacts, an external decoder, or
      # opt-in environment variables. The other phase1 tests use committed
      # vectors and remain in the self-contained Tier A set.
      - name: Run self-contained encoder tests
        run: |
          cargo test --locked --lib -- \
            --skip m5a_decode_check \
            --skip m55_streams_match_c_reference \
            --skip phase1_frontend_agreement_sine_f5 \
            --skip phase1e_sine_f5_band16_residue \
            --skip phase1e_onset_f24_bands_causality \
            --skip phase1f_multitone_f1_no_live_divergence \
            --skip phase1f_stepdown_f1_no_live_divergence \
            --skip phase1g_long_flips_residue \
            --skip phase1i_sine44_f5_tier_b \
            --skip phase1i_multitone_f5_tier_b \
            --skip phase1_full_stream_parity \
            --skip intensity_probe_c_oracle_parity \
            --skip intensity_probe_wav_parity \
            --skip intensity_probe_adts_decodes \
            --skip m511_profile_loop

      - name: Run public encoder API integration tests
        run: cargo test --locked --test production_api

      - name: Run encoder doctests
        run: cargo test --locked --doc

      - name: Verify package contents
        run: cargo package --locked -p ferrite-aac

  aac-convert:
    name: Build and test conversion app (Rust 1.99.1)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1

      - name: Build conversion app
        run: cargo build --locked -p aac-convert

      - name: Test conversion app
        run: cargo test --locked -p aac-convert

  # Formatting and Clippy are informational baselines only. Both report
  # known pre-existing repository drift and do not determine the workflow
  # result. They run as separate jobs so that a formatting failure cannot
  # skip Clippy.
  format-informational:
    name: Formatting (informational, non-gating)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust 1.99.1 with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt

      - name: Check formatting (informational)
        run: cargo fmt --all -- --check

  clippy-informational:
    name: Clippy (informational, non-gating)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust 1.99.1 with Clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: clippy

      - name: Run Clippy (informational)
        run: cargo clippy --locked --all-targets

  # Independent decode validation. This job deliberately uses the historical
  # Ferrite commit that the private FDK AAC reference was derived from, so no
  # private-reference token or externally published decoder artifact is needed.
  decode-validation:
    name: Independent AAC decode validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Check out trusted decoder source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          repository: whepper/ferrite
          ref: da00af1ca9624a213fb53c9ac52f6fec55e9b2af
          path: .decoder/reference
          fetch-depth: 0
          persist-credentials: false

      - name: Verify decoder source revision
        working-directory: .decoder/reference
        run: |
          set -euo pipefail
          expected=da00af1ca9624a213fb53c9ac52f6fec55e9b2af
          actual=$(git rev-parse HEAD)
          if [ "$actual" != "$expected" ]; then
            printf 'error: decoder source is %s, expected %s\n' "$actual" "$expected" >&2
            exit 1
          fi
          printf 'decoder source revision verified: %s\n' "$actual"

      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # dtolnay/rust-toolchain stable
        with:
          toolchain: 1.99.1

      - name: Build independent decoder
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          for tool in cmake c++; do
            command -v "$tool" >/dev/null 2>&1 || {
              printf 'error: required tool missing: %s\n' "$tool" >&2
              exit 1
            }
          done
          cmake -S .decoder/reference -B .decoder/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_PROGRAMS=ON \
            -DBUILD_SHARED_LIBS=OFF
          cmake --build .decoder/build --target aac-dec -j 2
          test -x .decoder/build/aac-dec
          decoder_rev=$(git -C .decoder/reference rev-parse HEAD)
          decoder_sha=$(sha256sum .decoder/build/aac-dec | awk '{print $1}')
          {
            printf '### Independent AAC decoder\n'
            printf -- '- Source commit: %s\n' "$decoder_rev"
            printf -- '- aac-dec SHA-256: %s\n' "$decoder_sha"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run decoder-backed tests
        working-directory: rust
        shell: bash
        env:
          AAC_DEC_BIN: ${{ github.workspace }}/.decoder/build/aac-dec
          LOG_DIR: ${{ runner.temp }}/decode-validation-logs
        run: |
          set -euo pipefail
          : "${AAC_DEC_BIN:?AAC_DEC_BIN is not set}"
          if [ ! -f "$AAC_DEC_BIN" ] || [ ! -x "$AAC_DEC_BIN" ]; then
            printf 'error: AAC_DEC_BIN=%s is missing or not executable\n' "$AAC_DEC_BIN" >&2
            exit 1
          fi
          mkdir -p "$LOG_DIR"
          run_test() {
            local test_path=$1
            local log=$2
            if ! cargo test --locked --lib -- \
              --exact "$test_path" --nocapture >"$log" 2>&1; then
              printf 'error: test failed: %s\n' "$test_path" >&2
              cat "$log" >&2
              return 1
            fi
          }
          run_test \
            aac_enc::stream_driver::m52_tests::crash_recovered_stream_decodes \
            "$LOG_DIR/crash.log"
          run_test \
            aac_enc::m5a_decode::m5a_tests::m5a_decode_check \
            "$LOG_DIR/m5a.log"
          run_test \
            aac_enc::stream_driver::is_integration_tests::intensity_probe_adts_decodes \
            "$LOG_DIR/adts.log"
          if ! bash "$GITHUB_WORKSPACE/rust/tools/check-decode-evidence.sh" \
            "$LOG_DIR/crash.log" "$LOG_DIR/m5a.log" "$LOG_DIR/adts.log"; then
            for log in "$LOG_DIR/crash.log" "$LOG_DIR/m5a.log" "$LOG_DIR/adts.log"; do
              printf '### %s\n' "$log" >&2
              cat "$log" >&2
            done
            exit 1
          fi
          grep -hE '^CRASH_RECOVERY_DECODE |^M5\.a ' \
            "$LOG_DIR/crash.log" "$LOG_DIR/m5a.log" || true
