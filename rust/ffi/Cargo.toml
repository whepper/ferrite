[package]
name = "aac_ffi"
version = "0.1.0"
edition = "2021"
# MSRV
rust-version = "1.99.1"
license = "FDK-AAC"
description = "Native Rust AAC decoder FFI derived from Fraunhofer FDK AAC (Ferrite)"
keywords = ["aac", "audio", "codec", "decoder", "fdk"]

[lib]
crate-type = ["lib"]

[dependencies]
itertools = "0.10.5"
num-complex = "0.4.6"
ferrite-aac = {path = ".."}

[features]
default = ["aac_dec"]
aac_dec = []
