[alias]
# Build the encoder library and conversion app
build_enc = "build --locked --features aac_enc"
build_convert = "build --locked -p aac-convert"

# Shorts for shorts
be = "build_enc"
bc = "build_convert"

# Check the encoder library and conversion app
check_enc = "check --locked --features aac_enc"
check_convert = "check --locked -p aac-convert"
