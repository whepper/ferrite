[package]
name = "ferrite-aac"
version = "0.4.0"
edition = "2021"
# MSRV
rust-version = "1.99.1"
license = "FDK-AAC"
license-file = "LICENSE-FDK-AAC"
description = "Native Rust AAC-LC encoder derived from Fraunhofer FDK AAC (Ferrite)"
readme = "README.md"
repository = "https://github.com/whepper/ferrite"
documentation = "https://docs.rs/ferrite-aac"
keywords = ["aac", "audio", "codec", "encoder", "fdk"]
categories = ["multimedia::audio", "multimedia::encoding"]

# Published-crate contents: the production library plus the materials needed
# to build, use, and understand it. Development-only material (test corpus,
# dev tooling, platform config, audit evidence) stays in the repository.
#
# The 18 cfg_*.txt snapshots are REQUIRED in the crate: production module
# src/aac_enc/psy_config.rs embeds them with include_str!. Every other file
# under src/aac_enc/testdata/ is read only by #[cfg(test)] code.
exclude = [
    "src/aac_enc/testdata/*",
    "!src/aac_enc/testdata/cfg_*.txt",
    # Benchmark/audit examples bound to the repository test corpus.
    "examples/aac_bench_wav.rs",
    "examples/m7_audit_spectral.rs",
    "examples/m7_audit_sweep.rs",
    # Developer tooling and local configuration.
    "tools/",
    ".cargo/",
    "rustfmt.toml",
    "Android.bp",
    # App-facing and historical docs; the encoder crate keeps the two
    # integration docs linked from its README.
    "docs/aac-convert-integration-contract.md",
    "docs/aac-convert-roadmap.md",
    "docs/user-manual.md",
    "docs/releases/",
    # NOTE: Cargo always ships the workspace Cargo.lock in the crate
    # (manifest exclude rules do not apply to it); publication uses
    # `cargo publish --locked -p ferrite-aac` and ships the lock as-is.
    # The repository Cargo.lock itself is unaffected.
]

[lib]
crate-type = ["lib"]

[dependencies]
arrayvec = "0.7.6"
bitflags = "2.5.0"
itertools = "0.15.0"
num-complex = "0.4.6"
paste = "1.0.15"
zerocopy = "0.8.20"

# Cargo build profiles
## Build profile to be used by developers when testing their code.
[profile.dev-release]
inherits = "release"
debug-assertions = true
overflow-checks = true


[workspace]
members = [
    "convert",
]
