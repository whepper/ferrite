[package]
name = "ferrite-aac"
version = "0.3.0"
edition = "2021"
# MSRV
rust-version = "1.99.1"
license = "FDK-AAC"
license-file = "LICENSE-FDK-AAC"
description = "Native Rust AAC-LC encoder derived from Fraunhofer FDK AAC (Ferrite)"
readme = "README.md"
keywords = ["aac", "audio", "codec", "encoder", "fdk"]

[lib]
crate-type = ["lib"]

[dependencies]
arrayvec = "0.7.6"
bitflags = "2.5.0"
itertools = "0.10.5"
num-complex = "0.4.6"
paste = "1.0.15"
zerocopy = "0.8.20"

[build-dependencies]
rustversion = "1.0.20"

[features]
default = ["aac_enc"]
aac_enc = []

# Cargo build profiles
## Build profile to be used by developers when testing their code.
[profile.dev-release]
inherits = "release"
debug-assertions = true
overflow-checks = true


[workspace]
members = [
    "convert",
]
