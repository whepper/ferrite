[package]
name = "aac-convert"
version = "0.4.0"
edition = "2021"
# MSRV
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
description = "FLAC to AAC (ADTS or M4A) converter for the native Ferrite Rust AAC encoder"
readme = "README.md"
repository = "https://github.com/whepper/ferrite"
documentation = "https://docs.rs/aac-convert"
keywords = ["aac", "audio", "converter", "flac", "cli"]
categories = ["multimedia::audio", "command-line-utilities"]

# Published-crate contents: the converter source, its READMEs, license
# texts, and notices.
#
# The integration suite under tests/ is strictly repository-development
# testing (CLI/batch behavior against a committed synthetic FLAC corpus)
# with no downstream value, so it is excluded. The shipped src unit tests
# need only six small fixtures, retained below; every other file under
# tests/fixtures/ (including the generator script) stays in the repository.
# The MIT/Apache texts and THIRD-PARTY-NOTICES.md must always ship.
exclude = [
    "tests/*.rs",
    "tests/common/",
    "tests/fixtures/*",
    "!tests/fixtures/stereo-48k-16.flac",
    "!tests/fixtures/mono-32k-16.flac",
    "!tests/fixtures/mono-441k-24.flac",
    "!tests/fixtures/stereo-48k-24.flac",
    "!tests/fixtures/three-channel-48k-16.flac",
    "!tests/fixtures/boundary-48k-24.flac",
]

[dependencies]
ferrite-aac = { version = "0.4.0", path = ".." }
# Pinned to the L3 evidence-phase selection; pure Rust, no C toolchain on the
# default build path. MIT. See docs/archive/aac-convert-l3-prep-report.md Gate 1.
ebur128 = "=0.1.11"
symphonia = { version = "0.6.1", default-features = false, features = ["flac"] }
# Pinned to the M7.5 feasibility-spike selection; zero dependencies, Apache-2.0.
shiguredo_mp4 = "=2026.5.0"

[[bin]]
name = "aac-convert"
path = "src/main.rs"
